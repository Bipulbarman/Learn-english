<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Block zooming -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Website Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", sans-serif;
      background-color: #121212;
      color: #fff;
      overflow: hidden;
      touch-action: manipulation;
    }
    #iframeContainer {
      display: none;
      width: 100%;
      height: 100%;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }

    #errorScreen, #loadingScreen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100%;
      padding: 20px;
      background-color: #121212;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
      color: #FF5252;
    }

    #errorScreen h1, #loadingScreen h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #errorScreen p, #loadingScreen p {
      font-size: 16px;
      opacity: 0.8;
    }

    #retryBtn {
      margin-top: 25px;
      padding: 12px 24px;
      background: #1E88E5;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    #retryBtn:hover {
      background: #1565C0;
    }

    #spinner {
      margin-top: 20px;
      border: 4px solid #444;
      border-top: 4px solid #1E88E5;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Iframe Container -->
  <div id="iframeContainer">
    <iframe id="webIframe" src=""></iframe>
  </div>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <h1>Loading Website...</h1>
    <div id="spinner"></div>
  </div>

  <!-- Error Screen -->
  <div id="errorScreen">
    <div class="icon">📡</div>
    <h1>No Internet Connection</h1>
    <p>You're offline. Please check your network and try again.</p>
    <button id="retryBtn">Retry Connection</button>
  </div>

  <script>
    const iframeURL = "https://example.com"; // Your website URL
    const iframeContainer = document.getElementById('iframeContainer');
    const errorScreen = document.getElementById('errorScreen');
    const loadingScreen = document.getElementById('loadingScreen');
    const retryBtn = document.getElementById('retryBtn');
    const iframe = document.getElementById('webIframe');

    function showErrorScreen() {
      iframeContainer.style.display = 'none';
      loadingScreen.style.display = 'none';
      errorScreen.style.display = 'flex';
    }

    function showLoading() {
      errorScreen.style.display = 'none';
      iframeContainer.style.display = 'none';
      loadingScreen.style.display = 'flex';
    }

    function showIframe() {
      errorScreen.style.display = 'none';
      loadingScreen.style.display = 'none';
      iframeContainer.style.display = 'block';
    }

    function checkConnectionAndLoad() {
      if (navigator.onLine) {
        showLoading();
        iframe.src = iframeURL;
      } else {
        showErrorScreen();
      }
    }

    // On iframe fully loaded, show it
    iframe.addEventListener('load', () => {
      showIframe();
    });

    retryBtn.addEventListener('click', checkConnectionAndLoad);

    window.addEventListener('online', checkConnectionAndLoad);
    window.addEventListener('offline', showErrorScreen);
    window.addEventListener('load', checkConnectionAndLoad);

    // Extra zoom prevention (iOS & Android)
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());
  </script>
</body>
</html>
